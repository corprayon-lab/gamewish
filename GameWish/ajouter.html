<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameWish — Ajouter un jeu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">GameWish</a>

    <nav class="site-nav">
      <a href="index.html">Accueil</a>
      <a href="categories.html">Catégories</a>
      <a href="populaires.html">Populaires</a>
      <a href="nouveautes.html">Nouveautés</a>
      <a href="ajouter.html">Ajouter</a>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <h1>Ajouter un jeu</h1>
      <p>Tu peux demander la création d’un jeu pour GameWish. Explique ton idée le plus précisément possible : type de jeu, règles, personnages, décor, difficulté et fonctionnalités souhaitées.</p>
    </section>

    <section class="form-section">
      <form class="game-request-form">
        <label for="game-type">Type de jeu souhaité</label>
        <select id="game-type" name="game-type" required>
          <option value="">Choisis un type de jeu</option>
          <option value="arcade">Arcade</option>
          <option value="reflexion">Réflexion</option>
          <option value="classique">Classique</option>
          <option value="aventure">Aventure</option>
          <option value="action">Action</option>
          <option value="course">Course</option>
          <option value="puzzle">Puzzle</option>
          <option value="autre">Autre</option>
        </select>

        <label for="game-name">Nom du jeu</label>
        <input
          id="game-name"
          name="game-name"
          type="text"
          placeholder="Exemple : Course spatiale"
          required
        >

        <label for="game-details">Détails du jeu</label>
        <textarea
          id="game-details"
          name="game-details"
          rows="8"
          placeholder="Explique comment le jeu doit fonctionner, ce que le joueur doit faire, les niveaux, les ennemis, les contrôles, le style visuel, etc."
          required
        ></textarea>

        <button class="button" type="submit">
          Envoyer ma demande
        </button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    
  </footer>

  <footer class="site-footer">
  <p>GameWish — Tes jeux, ton site.</p>
  </footer>

</body>
</html>
